name: PR Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Syntax check (compileall)
        run: python -m compileall -q . || true
      - name: Tests if present
        run: |
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt || true; fi
          if command -v pytest >/dev/null 2>&1; then pytest -q; else echo "no pytest"; fi
