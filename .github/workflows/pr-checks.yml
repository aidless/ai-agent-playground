name: PR Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Syntax check (compileall)
        run: python -m compileall -q . || true
      - name: Install dependencies (hash-pinned) and the project itself
        run: |
          if [ -f requirements.ci.lock ]; then pip install -q --require-hashes -r requirements.ci.lock; fi
          if [ -f pyproject.toml ]; then pip install -q -e . --no-deps; fi
      - name: Tests if present
        run: |
          if command -v pytest >/dev/null 2>&1; then pytest -q; else echo "no pytest"; fi
