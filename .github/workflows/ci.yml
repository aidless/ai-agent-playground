name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # agent/server.py:134 refuses to import without a key that starts with "sk-",
      # and the tests import it, so collection fails without this. It is a placeholder:
      # no test here calls the API.
      DEEPSEEK_API_KEY: sk-ci-placeholder
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: |
          uv run python -m pytest \
            --ignore=.hermes_test.py \
            --ignore=.run_test.py \
            --ignore=eval_harness \
            --tb=short -v \
            --junitxml=junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: junit.xml

  security:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: sk-ci-placeholder
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # Both scanners used to be `uv run <tool> ... || echo "<tool> done"`.
      # bandit is not in the dependency lock, so `uv run bandit` exits 2 with
      # "Failed to spawn" -- the scan never executed once, and `|| echo` turned
      # that into a green step. `uv run safety check` fails too (safety v3 needs
      # auth and exits 64 on the deprecated `check` subcommand), which is
      # indistinguishable from a real finding once swallowed.
      # uvx rather than adding them to pyproject: changing dev deps invalidates
      # uv.lock, and `uv sync --locked` above would then exit 2 and redden every push.
      - name: Bandit (security scan)
        # .bandit-baseline.json pins the 26 findings that already exist on this
        # tree (4 HIGH / 22 MEDIUM: B310 urlopen, B102 exec, B324 md5, B615
        # unpinned from_pretrained, B602/B307). Without a baseline, switching
        # the scan on would just make this job permanently red and get ignored.
        # With it, the gate fails on anything NEW. Shrink the baseline as the
        # findings are fixed; do not regenerate it from a dirty tree.
        run: uvx bandit -r agent/ ai_agent_playground/ scripts/ -ll -b .bandit-baseline.json
      - name: Dependency CVEs
        run: uvx pip-audit --progress-spinner=off

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    # uv build fails in this repository: setuptools.build_meta cannot produce the
    # sdist (the package data layout predates the current pyproject). Until that is
    # fixed, a failing build here would fail every push for a reason unrelated to any
    # change, so it runs on demand like the paper builds in agi-research.
    if: github.event_name == 'workflow_dispatch'
    env:
      DEEPSEEK_API_KEY: sk-ci-placeholder
      DEEPSEEK_BASE_URL: https://api.deepseek.com
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
