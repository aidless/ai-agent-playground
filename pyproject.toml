[project]
name = "ai-agent-playground"
version = "0.1.0"
description = "Building AI agents with Python, LangChain, and Claude API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.102.0",
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=1.60.0",
    "prometheus-client>=0.26.0",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "sse-starlette>=2.1.0",
    "streamlit>=1.57.0",
    "tenacity>=9.0.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
